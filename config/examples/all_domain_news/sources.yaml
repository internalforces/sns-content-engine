sources:
  official_updates_reusable:
    type: rss
    url: https://public.example.com/agency/press/feed.xml
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Sample official or government-style feed. Replace with a real public institution RSS feed."
    duplicate_window_days: 7

  corporate_ir_reusable:
    type: sitemap
    url: https://investors.example.com/newsroom/sitemap.xml
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Sample corporate newsroom or investor-relations sitemap. Replace with a real newsroom or IR source."
    duplicate_window_days: 7

  wikinews_attribution_friendly:
    type: rss
    url: https://wikinews.example.org/wiki/Special:NewsFeed?feed=rss
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Sample Wikinews-style source with attribution-friendly defaults."
    duplicate_window_days: 3

  gdelt_latest_discovery:
    type: gdelt
    query: "domain:news"
    notes: "Sample GDELT discovery-only source. Keep it in a separate discovery source set until policy-aware enrichment skips are enabled."

source_sets:
  public_reusable:
    sources:
      - official_updates_reusable

  corporate_reusable:
    sources:
      - corporate_ir_reusable

  attribution_friendly_reusable:
    sources:
      - wikinews_attribution_friendly

  all_domain_primary:
    sources:
      - official_updates_reusable
      - corporate_ir_reusable
      - wikinews_attribution_friendly

  discovery_only_monitoring:
    sources:
      - gdelt_latest_discovery
