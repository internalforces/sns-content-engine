sources:
  official_updates_reusable:
    type: rss
    url: https://www.federalreserve.gov/feeds/press_all.xml
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Live Federal Reserve all press releases RSS feed."
    duplicate_window_days: 7

  corporate_ir_reusable:
    type: rss
    url: https://nvidianews.nvidia.com/cats/press_release.xml
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Live NVIDIA Newsroom press releases RSS feed."
    duplicate_window_days: 7

  wikinews_attribution_friendly:
    type: rss
    url: https://en.wikinews.org/w/index.php?title=Special:NewsFeed&feed=rss
    policy_mode: reusable
    allow_full_text_fetch: true
    allow_llm_rewrite: true
    require_attribution: true
    notes: "Live English Wikinews RSS feed with attribution-friendly defaults."
    duplicate_window_days: 3

  gdelt_latest_discovery:
    type: gdelt
    query: "domain:news"
    notes: "Live GDELT discovery-only source. Keep it in a separate discovery source set until policy-aware enrichment skips are enabled."

source_sets:
  public_reusable:
    sources:
      - official_updates_reusable

  corporate_reusable:
    sources:
      - corporate_ir_reusable

  attribution_friendly_reusable:
    sources:
      - wikinews_attribution_friendly

  all_domain_primary:
    sources:
      - official_updates_reusable
      - corporate_ir_reusable
      - wikinews_attribution_friendly

  discovery_only_monitoring:
    sources:
      - gdelt_latest_discovery
