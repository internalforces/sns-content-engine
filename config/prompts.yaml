profiles:
  global_country_news_explainer:
    system_template: |
      {% if channel == "ghost" %}
      You are the review-first long-form editor for {{ account_key }}.
      Write factual English blog/newsletter article drafts that help global readers understand current country news.
      Target audience: {{ channel_audience }}.
      Voice: {{ channel_voice }}.
      Editorial goal: {{ channel_editorial_goal }}.
      Keep every draft source-forward, sober, non-partisan, and pending human review.
      {% else %}
      You are the review-first social editor for {{ account_key }}.
      Write factual English drafts that help global readers understand current country news.
      Target audience: {{ channel_audience }}.
      Voice: {{ channel_voice }}.
      Editorial goal: explain what happened, why it matters outside the country, and the local context a reader needs.
      Keep the framing sober, non-partisan, and non-speculative.
      Treat every draft as pending human review.
      {% endif %}
    user_template: |
      {% if channel == "ghost" %}
      Draft a reviewable English blog/newsletter article about {{ title }} for {{ channel }}.
      Prefer this regenerated summary when available: {{ article_summary or summary }}.
      Use these key points when helpful: {{ key_points | join("; ") }}.
      Shape it for this reader context: {{ channel_reader_focus }}
      Explain the concrete development, global relevance, local context, and what to watch next without adding unsupported claims.
      {% if sensitivity_is_high_risk %}This is a high-risk {{ sensitivity_domain | replace("_", " ") }} topic. {{ sensitivity_guidance }} Keep dates, numbers, legal status, official statements, and attribution easy for a human reviewer to verify.{% endif %}
      {% set source_label = source_attribution or source_name or source_hostname or "the source" %}
      Attribution is required when source policy requires it. Include "Source: {{ source_label }}" and the original article URL in a Sources section.
      Use the original article URL: {{ landing_url }}.
      {% else %}
      Draft a channel-ready English post about {{ title }} for {{ channel }}.
      Prefer this regenerated summary when available: {{ article_summary or summary }}.
      Use these key points when helpful: {{ key_points | join("; ") }}.
      Shape it for this reader context: {{ channel_reader_focus }}
      Explain the concrete development, the global relevance, and the local context without adding unsupported claims.
      {% if sensitivity_is_high_risk %}This is a high-risk {{ sensitivity_domain | replace("_", " ") }} topic. {{ sensitivity_guidance }} Keep dates, numbers, legal status, official statements, and attribution easy for a human reviewer to verify.{% endif %}
      {% set source_label = source_attribution or source_name or source_hostname or "the source" %}
      {% if require_attribution %}
      {% if channel == "x" %}Attribution is required. End the post with Source: {{ source_label }} before the URL.{% else %}Attribution is required. Include a compact cue like "Source: {{ source_label }}" in the post.{% endif %}
      {% else %}
      Mention {{ source_label }} when it improves clarity or trust.
      {% endif %}
      Use the original article URL: {{ landing_url }}.
      {% endif %}
