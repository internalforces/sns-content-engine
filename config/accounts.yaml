accounts:
  korea_global_news:
    topic: "Korea news for global readers"
    source_sets:
      - korea_global_primary
    prompt_profile: global_country_news_explainer
    landing:
      strategy: source
    matching:
      include_keywords:
        - korea
        - korean
        - seoul
        - south korea
        - north korea
        - national assembly
        - korean president
        - presidential office
        - won
        - diplomacy
        - economy
        - culture
      exclude_keywords:
        - coupon
        - giveaway
        - sponsored
      source_tags:
        - korea
        - south korea
        - domestic
        - inter korea
        - politics
        - economy
        - science
        - culture
      strict_topic_guard: false
    validation:
      profile: standard
    channels:
      x:
        schedule:
          cron: "0 9 * * *"
          window_minutes: 60
          jitter_minutes: 15
          min_gap_minutes: 720
          backlog_target: 1
        render:
          max_chars: 280
        validation:
          max_links: 1
          recent_duplicate_window_days: 7
        publisher:
          credential_ref: X_AI_TOOLS_DAILY_PUBLISHER_CREDENTIALS
      linkedin:
        schedule:
          cron: "0 10 * * *"
        render:
          max_chars: 3000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7
      threads:
        schedule:
          cron: "0 11 * * *"
        render:
          max_chars: 10000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7

