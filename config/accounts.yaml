accounts:
  ai_tools_daily:
    topic: "AI workflows and guides"
    source_sets:
      - ai_tools_primary
    prompt_profile: ai_tools_default
    landing:
      strategy: source
    matching:
      include_keywords:
        - ai
        - agent
        - workflow
        - automation
        - guide
      exclude_keywords:
        - seo
        - backlink
        - search ranking
        - earnings
        - stock
      source_tags:
        - ai
        - automation
        - workflow
        - guide
      strict_topic_guard: true
    channels:
      x:
        schedule:
          cron: "0 9 * * *"
          window_minutes: 60
          jitter_minutes: 15
          min_gap_minutes: 180
          backlog_target: 2
        render:
          max_chars: 280
        publisher:
          credential_ref: X_AI_TOOLS_DAILY_PUBLISHER_CREDENTIALS
      linkedin:
        schedule:
          cron: "0 10 * * *"
        render:
          max_chars: 3000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7
      threads:
        schedule:
          cron: "0 11 * * *"
        render:
          max_chars: 10000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7

  seo_tools_daily:
    topic: "SEO tools and search optimization"
    source_sets:
      - seo_tools_primary
    prompt_profile: seo_tools_default
    landing:
      strategy: source
    matching:
      include_keywords:
        - seo
        - search
        - backlink
        - audit
      exclude_keywords:
        - earnings
        - stock
      source_tags:
        - seo
        - search
      strict_topic_guard: true
    channels:
      x:
        schedule:
          cron: "0 11 * * *"
          window_minutes: 60
          jitter_minutes: 15
          min_gap_minutes: 180
          backlog_target: 2
        render:
          max_chars: 280
        publisher:
          credential_ref: X_SEO_TOOLS_DAILY_PUBLISHER_CREDENTIALS
      linkedin:
        schedule:
          cron: "0 12 * * *"
        render:
          max_chars: 3000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7
      threads:
        schedule:
          cron: "0 13 * * *"
        render:
          max_chars: 10000
        validation:
          max_links: 1
          recent_duplicate_window_days: 7
