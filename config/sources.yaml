sources:
  ai_tools_rss:
    type: sitemap
    url: https://odtoolbase.com/sitemap.xml
    include_url_prefixes:
      - https://odtoolbase.com/guides
    duplicate_window_days: 14

  ai_tools_manual:
    type: manual_csv
    path: ../data/ai_tools_manual.csv

  seo_tools_rss:
    type: sitemap
    url: https://odtoolbase.com/sitemap.xml
    include_url_prefixes:
      - https://odtoolbase.com/seo
    duplicate_window_days: 14

  seo_tools_manual:
    type: manual_csv
    path: ../data/seo_tools_manual.csv

source_sets:
  ai_tools_primary:
    sources:
      - ai_tools_rss
      - ai_tools_manual

  seo_tools_primary:
    sources:
      - seo_tools_rss
      - seo_tools_manual
