[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sns-content-engine"
dynamic = ["version"]
description = "Config-driven multi-account SNS content automation engine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "Codex" },
]
dependencies = [
  "apscheduler>=3.10,<4.0",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "openai>=1.0,<3.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
sns-engine = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]
