[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sns-content-engine"
dynamic = ["version"]
description = "Config-driven multi-account SNS content automation engine."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [
  { name = "internalforces", email = "81242244+internalforces@users.noreply.github.com" },
]
dependencies = [
  "apscheduler>=3.10,<4.0",
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "openai>=1.0,<3.0",
  "pydantic>=2.8,<3.0",
  "PyYAML>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2.0",
  "mypy>=1.11,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
sns-engine = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"app/**/__init__.py" = ["F401"]
"app/api/console_views.py" = ["F401"]
"app/workflows/review_queue.py" = ["F401"]
"scripts/*.py" = ["E402"]
"tests/**/*.py" = ["F401", "F821", "F841"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
files = [
  "app/analytics",
  "app/api/schemas.py",
  "app/domain",
  "app/workflows/review_models.py",
  "app/workflows/review_support.py",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]
